name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23.x", "1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v7
        with: { path: camada-go }
      # Golden snapshot fixtures and the beacon pinned to its vendored release tag.
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-core
          path: camada-core
      - id: beacon
        run: |
          f=camada-go/internal/beacon/version.txt
          v=$(tr -d '[:space:]' < "$f")
          [ -n "$v" ] || { echo "::error::no vendored beacon version in $f"; exit 1; }
          echo "ref=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-browser
          path: camada-browser
          ref: ${{ steps.beacon.outputs.ref }}
      - uses: actions/setup-node@v7
        with: { node-version: 22.x }
      - run: npm install && npm run build
        working-directory: camada-browser
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: gofmt -l . | (! grep .) && go vet ./... && go test ./...
        working-directory: camada-go
