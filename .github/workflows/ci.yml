name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23.x", "1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v4
        with: { path: camada-go }
      # The golden snapshot fixtures the suite is pinned to, and the beacon build the package vendors.
      - uses: actions/checkout@v4
        with: { repository: ${{ github.repository_owner }}/camada-core, path: camada-core }
      - uses: actions/checkout@v4
        with: { repository: ${{ github.repository_owner }}/camada-browser, path: camada-browser }
      - uses: actions/setup-node@v4
        with: { node-version: 22.x }
      - run: npm install && npm run build
        working-directory: camada-browser
      - uses: actions/setup-go@v5
        with: { go-version: ${{ matrix.go }} }
      - run: gofmt -l . | (! grep .) && go vet ./... && go test ./...
        working-directory: camada-go
